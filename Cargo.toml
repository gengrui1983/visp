[workspace]
resolver = "2"
members = [
    "crates/visp", "crates/visp-agent",
    "crates/visp-tui",
    "crates/visp-acp",
    "crates/visp-codegraph",
    "crates/visp-command",
    "crates/visp-config",
    "crates/visp-context",
    "crates/visp-core",
    "crates/visp-daemon",
    "crates/visp-db",
    "crates/visp-fs",
    "crates/visp-hooks",
    "crates/visp-llm",
    "crates/visp-mcp",
    "crates/visp-observability",
    "crates/visp-proto",
    "crates/visp-tools",
]

[workspace.package]
version = "0.5.4"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/laonger/visp"

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
async-trait = "0.1"
arc-swap = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt", "json"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
bytes = "1"
futures = "0.3"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "tls"] }
tracing-opentelemetry = "0.33"
# 不启用 macos_kqueue：其递归监听会为每个文件/目录持有常驻 fd（EVFILT_VNODE），
# 大项目（含 node_modules）会撞 ulimit 报 EMFILE。默认的 macos_fsevent 后端无此问题。
notify = { version = "7" }
