# =============================================================================
# visp daemon 配置模板
# =============================================================================
# 放置位置： ~/.config/visp/daemon.toml  (全局配置)
#           .visp/daemon.toml            (项目级配置，可选)
#
# 配置优先级（从高到低）：
#   1. CLI 参数指定的配置文件路径
#   2. 项目级配置 cwd/.visp/daemon.toml （[llm] 和 [[agent.builtin]] 部分会 merge 到全局配置）
#   3. 全局配置 ~/.config/visp/daemon.toml
#   4. 环境变量（OPENAI_API_KEY / ANTHROPIC_API_KEY，仅当 api_key 字段未设置时生效）
#
# 项目级配置通常只包含 [llm] 和/或 [[agent.builtin]] 部分。
# [llm] 用于覆盖全局配置中的模型设置（如 api_key、base_url 等）。
# 匹配规则：同 provider/name 或同 model/protocol 视为同一模型，project 值覆盖 global 值；project 中新增的模型会被追加。
# [[agent.builtin]] 用于覆盖内置 agent 的 model/temperature/steps。
# 匹配规则：按 name 匹配同名 agent，project 值覆盖 global 值；project 中新增的 agent 会被追加。
#
# 所有字段均有默认值，不创建此文件也能正常运行。
# 此模板列出了所有可配置项及其默认值，按需取消注释修改即可。
# =============================================================================

# ---------------------------------------------------------------------------
# [daemon] — 守护进程自身配置
# ---------------------------------------------------------------------------
[daemon]
# gRPC 监听地址
# listen_addr = "[::1]:50051"

# 日志级别: trace, debug, info, warn, error
# log_level = "info"

# ---------------------------------------------------------------------------
# [llm] — 大语言模型配置
# ---------------------------------------------------------------------------
# 使用 [[llm.models]] 配置多个模型，在 CLI 中用 /model 切换。
# ---------------------------------------------------------------------------

[llm]
# 预设模型（格式 {provider}/{name}），缺省时使用 models 第一个
# default = "Anthropic/Claude Sonnet"

[[llm.models]]
name = "Claude Sonnet"
provider = "Anthropic"
protocol = "anthropic"
model = "claude-sonnet-4-20250514"
# api_key 缺省时依次尝试: 字段 api_key → 环境变量 ANTHROPIC_API_KEY
# api_key = "${ANTHROPIC_API_KEY}"
temperature = 0.3
max_tokens = 8192
max_context_tokens = 128000
# Claude thinking 模式预算 token（仅 anthropic 协议有效）
# thinking_budget_tokens = 2048

[[llm.models]]
name = "GPT-4o"
provider = "OpenAI"
protocol = "openai"
model = "gpt-4o"
api_key = "${OPENAI_API_KEY}"
# base_url = "https://api.openai.com/v1"
temperature = 0.3
max_tokens = 16384
max_context_tokens = 128000

# ---------------------------------------------------------------------------
# [tools] — 工具全局配置
# ---------------------------------------------------------------------------
[tools]
# bash 命令超时时间（秒）
# bash_timeout_secs = 120

# 读文件大小限制（字节），默认 1MB
# file_max_size_bytes = 1048576

# ---------------------------------------------------------------------------
# [agent] — Agent 循环配置
# ---------------------------------------------------------------------------
[agent]
# 软上限：达到此轮次后在 LLM 调用前注入"请收尾"提示，由模型自主决定何时结束
# 设为 0 表示关闭软上限，依赖硬上限兜底
# 兼容旧字段名 max_iterations（二者等价）
# soft_limit = 50

# 连续相同工具调用的 doom_loop 检测窗口（0 = 关闭）
# doom_loop_threshold = 5

# LLM 调用失败时的重试次数
# llm_retry_attempts = 3

# 重试基础延迟（毫秒），每次重试会指数退避
# llm_retry_base_delay_ms = 1000

# bash 执行前是否需要用户确认
# true=安全模式（推荐），false=静默执行
# bash_confirm_mode = true

# 工具可操作文件大小限制（字节）
# file_max_size_bytes = 1048576

# ---------------------------------------------------------------------------
# 上下文管理（自适应估算 + 压缩 + 持久任务记忆）
# ---------------------------------------------------------------------------
[agent.context]
# 关闭后退回不裁剪行为（仅用于调试）
# enabled = true
# 持久任务记忆 + memory 工具
# memory_enabled = true
# 保护的开头轮数（任务目标）与末尾轮数（最近工作流）
# head_turns = 2
# tail_turns = 6
# 达到预算百分比触发压缩；压缩到 target，形成滞后区间
# compact_trigger_pct = 80
# compact_target_pct = 45
# 额外 token 安全边际（百分比）
# safety_margin_pct = 12
# 单条工具输出保留的最大字符数（首尾保留）
# tool_output_max_chars = 8000
# 输出 token 最小预留
# min_output_tokens = 2000
# 压缩摘要最大 token
# max_summary_tokens = 1200
# 注入摘要/检索的最大记忆条数
# max_memory_entries = 80
# 服务端上下文超长后的自救重试次数
# overflow_retries = 2

# ---------------------------------------------------------------------------
# 内置 Agent 覆盖配置
# ---------------------------------------------------------------------------
# visp 内置了 default、explorer、fixer 三个 agent。
# 通过 [[agent.builtin]] 可以在不修改源码的情况下覆盖内置 agent 的
# model / temperature / steps。
#
# 优先级：内置定义 < [[agent.builtin]] 配置 < ~/.config/visp/agents/*.md < .visp/agents/*.md
#
# model 格式：{provider}/{name} 或 {provider}/{model}
#   如 "Opencode/deepseek-v4-flash" 或 "Anthropic/Claude Sonnet"
# 未指定 model 的内置 agent 会继承 session 默认模型。
#
# [[agent.builtin]]
# name = "explorer"
# model = "Opencode/deepseek-v4-flash"
# temperature = 0.1
#
# [[agent.builtin]]
# name = "fixer"
# model = "Opencode/deepseek-v4-flash"
# temperature = 0.2
# steps = 30

# ---------------------------------------------------------------------------
# [notification] — 终端桌面通知
# ---------------------------------------------------------------------------
# 在「回合完成 / 等待用户输入」两个事件点向终端发送原生通知。
# 依赖终端支持 OSC 通知转义序列，且要求 stdout 为 tty（管道、重定向时自动禁用）。
# 通知失败或终端不支持时静默忽略，不影响正常使用。
[notification]

# 总开关（false 时完全静默）
# enabled = true

# 回合完成后通知
# on_complete = true

# 等待用户确认或输入时通知
# on_user_input = true

# 协议：auto=自动探测，osc9=ghostty/iTerm2，osc777=WezTerm，kitty99=kitty
# protocol = "auto"

# 同一类通知的最小间隔（秒），用于限流；0 表示不限流
# min_interval_secs = 3

# ---------------------------------------------------------------------------
# [observability] — 日志、Trace、Metrics 观测配置
# ---------------------------------------------------------------------------
[observability]
# 是否启用 observability 初始化。关闭后不会安装 tracing subscriber，也不会导出 OTLP。
# enabled = true

# tracing 过滤级别；也可用 RUST_LOG 环境变量覆盖。
# level = "info"

# 控制台/文件日志格式：json 或 pretty。
# format = "json"

# 是否启用跨异步任务的父子 span 关联。
# parent_link = true

# 是否保留内部 metrics summary 句柄。
# metrics_summary = true

# 可选：日志目录。设置后按天滚动写入 visp-daemon.log；不设置则输出到 stdout。
# 默认：~/.visp/logs
# log_file = "~/.visp/logs"

# ----- OpenTelemetry / OTLP -----
[observability.otlp]
# 是否通过 OTLP 导出 trace。
# enabled = false

# OTLP Collector/后端地址。当前实现使用 OTLP/gRPC，通常端口为 4317。
# endpoint = "http://localhost:4317"

# 协议字段；当前建议使用 grpc。
# protocol = "grpc"

# OTLP 导出超时时间（秒）。
# timeout_secs = 10

# Trace 采样率，范围 0.0 ~ 1.0；超出范围会被夹到有效区间。
# sample_rate = 1.0

# 可选：OTLP headers，常用于鉴权。
# [observability.otlp.headers]
# Authorization = "Bearer your-token"

# ----- Langfuse -----
# 在 span 上设置 Langfuse 语义字段，用于 Langfuse 关联 trace/session/用户/tag。
# 这些字段是 Langfuse 标准属性，非 OTel 原生属性，由 tracing 字段注入。
# langfuse.session.id 由 daemon 根据当前 session 自动填充。
#
# 此配置仅控制 visp 写入的 Langfuse 语义字段，不包含 Langfuse 连接配置。
# Langfuse 连接（endpoint/public key/secret key）属于 OpenTelemetry Collector
# 配置，而非 visp 配置。参考 Collector 配置见 docs/otel-collector-langfuse.example.yaml。
# visp 不管理 Collector 进程；Collector 示例仅为参考，不代表 visp 管理 Collector。
#
# [observability.langfuse]
# enabled = true
# user_id = "user_456"
# tags = ["agent", "weather"]
# environment = "production"
# release = "1.0.0"
# version = "abc123"
# public = true
#
# [observability.langfuse.metadata]
# env = "prod"
# count = 42
#
# [observability.langfuse.capture]
# input = false
# output = false

# =============================================================================
# [tool.*] — 各工具的 per-tool 配置
# =============================================================================
# 所有工具现在都支持通过 [tool.<工具名>] 段独立配置。
# 具体支持字段见下方各段说明。
# =============================================================================

# ----- bash -----
# Shell 命令执行工具
[tool.bash]
# 附加的黑名单命令（在硬编码黑名单之上追加）
# hardcoded 黑名单始终生效: sudo, rm -rf /, chmod 777, chmod 7777
# 硬编码破坏性命令检测始终生效: rm, rmdir, del, dd, format, mkfs, > 等
# blocked_commands = ["docker stop", "systemctl"]

# 默认超时（秒），调用未指定 timeout 时使用
# default_timeout_secs = 120

# 输出截断大小（字节）
# max_output_bytes = 102400

# ----- read_file -----
# 文件读取工具
[tool.read_file]
# 文件大小限制（字节）
# max_file_size = 1048576

# ----- write_file -----
# 文件写入工具（默认无需审批）
[tool.write_file]
# 文件大小限制（字节，仅兼容，当前不使用）
# max_file_size = 1048576

# 是否要求用户审批（默认 false，项目目录内写文件无需确认）
# require_approval = false

# ----- edit_file -----
# 文件精确替换编辑工具（默认无需审批）
[tool.edit_file]
# 文件大小限制（字节）
# max_file_size = 1048576

# 是否要求用户审批（默认 false，项目目录内编辑文件无需确认）
# require_approval = false

# ----- grep -----
# 内容搜索工具（支持正则）
[tool.grep]
# 搜索超时（秒）
# timeout_secs = 30

# 额外排除目录（在硬编码排除列表之上追加）
# hardcoded 排除始终生效: .git, node_modules, target, .venv, __pycache__, dist, build
# exclude_dirs = ["vendor", ".cache"]

# ----- glob -----
# 文件名搜索工具（支持通配符）
[tool.glob]
# 搜索超时（秒）
# timeout_secs = 30

# ----- webfetch -----
# 网络抓取工具
[tool.webfetch]
# 允许访问的域名白名单（空 = 需要用户确认）
# allow_domains = ["docs.rs", "crates.io", "github.com"]

# 请求超时（秒，上限 120）
# timeout_secs = 30

# =============================================================================
# [mcp] — MCP 服务器配置
# =============================================================================
# MCP（Model Context Protocol）服务器配置项。
# Daemon 启动时会自动连接列出的服务器，将提供的工具集成到 Tool Registry 中，
# Agent 循环即可一视同仁调用。
#
# 支持四种传输方式：
#   stdio — 以子进程方式启动 MCP 服务器（如 npx、uvx 命令）
#   sse   — HTTP SSE 方式连接已运行的 MCP 服务器
#   http  — MCP Streamable HTTP（POST-only 单端点，遵循官方规范）
#   get   — 简易 HTTP GET 方式（非标准 MCP，无协议握手）
#
# 每项可选字段：
#   enabled             — 是否自动连接（默认 true）
#   tool_prefix         — 工具名前缀，防止不同服务器工具名冲突（默认无前缀）
#   tool_timeout_secs   — 工具调用超时（秒，默认 60）
# =============================================================================

# ----- stdio 示例（npx 启动 Playwright MCP 服务器） -----
# [[mcp.servers]]
# name = "playwright"
# transport = { type = "stdio", command = "npx", args = ["@anthropic-ai/mcp-playwright"] }
# tool_timeout_secs = 120

# ----- stdio 示例（uvx 启动 fetch MCP 服务器） -----
# [[mcp.servers]]
# name = "fetch"
# transport = { type = "stdio", command = "uvx", args = ["mcp-server-fetch"] }

# ----- stdio 示例（自定义脚本 + API Key） -----
# API Key 通过 env 传入环境变量，子进程继承 daemon 环境 + 此处叠加/覆盖
# [[mcp.servers]]
# name = "custom-script"
# transport = { type = "stdio", command = "python", args = ["server.py"], env = { API_KEY = "sk-xxx" } }

# ----- SSE 示例（连接已运行的 MCP HTTP 服务器） -----
# API Key 通过 headers 传入 HTTP 请求头
# [[mcp.servers]]
# name = "custom-api"
# transport = { type = "sse", url = "http://localhost:8080/mcp", headers = { Authorization = "Bearer sk-xxx" } }
# tool_prefix = "custom_"

# ----- http 示例（MCP Streamable HTTP，如 context7） -----
# 所有交互通过单一 POST 端点完成：initialize / tools/list / tools/call
# [[mcp.servers]]
# name = "context7"
# transport = { type = "http", url = "https://mcp.context7.com/mcp" }

# ----- http 示例（带认证头） -----
# [[mcp.servers]]
# name = "remote-api"
# transport = { type = "http", url = "https://example.com/mcp", headers = { Authorization = "Bearer sk-xxx" } }

# ----- get 示例（简易 HTTP GET，非标准 MCP） -----
# 无协议握手：工具发现 GET {url}/tools，工具调用 GET {url}/call?name=xxx
# 端点可用 tools_endpoint / call_endpoint 自定义（默认 "/tools" 和 "/call"）
# [[mcp.servers]]
# name = "simple-tools"
# transport = { type = "get", url = "http://localhost:9000" }
# tools_endpoint = "/tools"
# call_endpoint = "/call"

# =============================================================================
# [hooks] — 生命周期钩子（lifecycle hooks）
# =============================================================================
# 在 visp 生命周期的固定节点执行用户自己的命令（写状态文件、审批时推送、
# 回合结束触发 git/CI、错误告警、喂给多路复用器等）。
#
# 事件名（PascalCase）：
#   SessionStart  UserPromptSubmit  AgentRunEnd  SubagentStop
#   Stop  StopFailure  ToolCallRequested  PreToolUse  PostToolUse
#   PostToolUseFailure  PermissionRequest  PermissionResult  SessionEnd
#
# 投递：标量（VISP_HOOK_EVENT / VISP_SESSION_ID / VISP_PROJECT_PATH /
#   VISP_HOOK_RULE_ID 等）经环境变量传入；完整载荷以 JSON 写入子进程
#   stdin（写完即关）。
#
# 环境：子进程默认「不继承」daemon 环境，仅白名单
#   PATH / HOME / TERM / LANG 与 VISP_* / HERDR_* 前缀，外加规则自身的 env。
#
# 执行：全异步、绝不阻断 agent 主流程；每规则强制 timeout_ms（超时杀整个
#   进程树）；失败静默（仅日志 + 计数），不重试。
#
# 安全：全局规则默认启用；项目级规则（.visp/daemon.toml）默认惰性、须显式
#   信任，且项目级 command 必须位于 .visp/hooks/ 内、禁止 sh -c 包装。
#
# 诊断：visp hooks list | doctor | test <id|event> | logs
# 设计文档：docs/design/2026-09-27-visp-hooks-design.md
# =============================================================================

# ---------------------------------------------------------------------------
# [[hooks.rules]] — 规则示例（均默认注释掉）
# ---------------------------------------------------------------------------
# command 为 argv 首元素、无 shell 解析；args 为其后的参数数组。
# 同事件多规则按 id 字典序执行（可用 order 覆盖）。

# ----- 示例 1：回合结束写时间戳 -----
# [[hooks.rules]]
# id = "10-log-turn-end"
# event = ["Stop"]
# command = "/usr/bin/date"
# args = ["+%Y-%m-%dT%H:%M:%S"]
# timeout_ms = 2000

# ----- 示例 2：等待审批时发桌面通知 -----
# [[hooks.rules]]
# id = "20-notify-blocked"
# event = ["PermissionRequest"]
# command = "/usr/bin/osascript"
# args = ["-e", "display notification \"visp 等待审批\""]
# timeout_ms = 3000

# ----- 示例 3：herdr 状态上报（随包脚本，须用绝对路径） -----
# 脚本来自 assets/hooks/herdr.hook.sh，复制到 ~/.config/visp/hooks/ 后填其
# 绝对路径。注意：command 中的 ~ 不会展开，请写绝对路径。脚本仅在 herdr
# pane 内（HERDR_ENV=1）生效。
# [[hooks.rules]]
# id = "herdr"
# event = ["SessionStart", "UserPromptSubmit", "PermissionRequest", "Stop", "StopFailure", "AgentRunEnd", "SubagentStop", "SessionEnd"]
# command = "/abs/path/to/.config/visp/hooks/herdr.hook.sh"
# on_full = "coalesce_latest"
# timeout_ms = 2000

# ---------------------------------------------------------------------------
# 规则字段说明
# ---------------------------------------------------------------------------
# id          规则唯一名；决定同事件多规则的字典序（必填，同作用域内不可重复）
# order       显式顺序覆盖（缺省按 id 字典序）
# event       命中事件名数组（必填，PascalCase）
# matcher     正则匹配 tool_name / source / kind（缺省全匹配）
# command     argv 首元素，无 shell；项目级须位于 .visp/hooks/ 内（必填）
# args        传给 command 的参数数组
# env         规则显式注入的环境变量表（叠加在白名单之上）
# cwd         工作目录（缺省取 project_path）
# timeout_ms  单次执行超时，单位毫秒（默认 60000）
# enabled     是否启用（默认 true）
# on_full     队列溢出策略：drop_new | drop_old | coalesce_latest（默认 drop_new）
# parallel    放开同规则并发、放弃默认保序（默认 false）
# cooldown_ms 最小触发间隔，单位毫秒（默认 0）
# include     载荷可选字段：prompt / tool_input / tool_response（默认空 = 脱敏）
